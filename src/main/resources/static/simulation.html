<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mindfulness Platform - Simulation</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f0f2f5; margin: 0; }
        .container { background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 100%; }
        h1 { color: #333; margin-bottom: 1.5rem; }
        button { background-color: #5865F2; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; transition: background 0.3s; width: 100%; }
        button:hover { background-color: #4752C4; }
        #status { margin-top: 1rem; font-weight: bold; min-height: 24px; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Mindfulness Platform</h1>
        <p>Simulator needed.</p>
        <button onclick="registerMember()">Sign Up Implementation Test</button>
        <div id="status"></div>
    </div>

    <script>
        async function registerMember() {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = 'Processing...';
            statusDiv.className = '';
            
            try {
                const response = await fetch('/api/members/register', { 
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                
                if (response.ok) {
                    const text = await response.text();
                    statusDiv.textContent = 'Success: ' + text;
                    statusDiv.className = 'success';
                } else {
                    statusDiv.textContent = 'Error: ' + response.status;
                    statusDiv.className = 'error';
                }
            } catch (e) {
                statusDiv.textContent = 'Network Error: ' + e.message;
                statusDiv.className = 'error';
            }
        }
    </script>
</body>
</html>
